spring.application.name=hirewise-backend

# ==========================================
# MySQL Database Configuration
# ==========================================
# JDBC URL: connects to local MySQL port 3306, automatically creates 'hirewise_ai' if missing
spring.datasource.url=jdbc:mysql://localhost:3306/hirewise_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credentials safely read from environment variables (never hardcoded in source files)
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Automatically updates table schemas in development without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Print formatted SQL statements in terminal for learning and debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT Configuration
# ==========================================
# Reads secret from JWT_SECRET environment variable (must be >= 32 characters for HS256)
hirewise.jwt.secret=${JWT_SECRET:}
# Expiration time in milliseconds: 86400000 ms = 24 hours
hirewise.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Multipart & File Upload Configuration
# ==========================================
# Maximum file size 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
hirewise.storage.resume-dir=${RESUME_STORAGE_DIR:./storage/resumes}

# ==========================================
# AI Resume Analyzer Configuration
# ==========================================
hirewise.ai.provider=${AI_PROVIDER:local}
hirewise.ai.api-key=${AI_API_KEY:}
hirewise.ai.model=${AI_MODEL:gemini-1.5-flash}
hirewise.ai.timeout-ms=${AI_TIMEOUT_MS:8000}
